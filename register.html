<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - HomeGuardian AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #12222E 0%, #2C5F7C 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
      font-weight: bold;
      color: #12222E;
    }

    .logo span {
      color: #C08A3E;
    }

    h1 {
      text-align: center;
      color: #12222E;
      margin-bottom: 0.5rem;
      font-size: 1.8rem;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #12222E;
      font-weight: 600;
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #2C5F7C;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2C5F7C;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #1a3a4a;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .footer-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #666;
    }

    .footer-link a {
      color: #C08A3E;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }

    .status-message {
      text-align: center;
      margin-top: 1rem;
      min-height: 20px;
    }

    .error {
      color: #e74c3c;
      font-weight: 600;
    }

    .success {
      color: #27ae60;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🏠 Home<span>Guardian</span></div>
    <h1>Create Account</h1>
    <p class="subtitle">Join HomeGuardian AI today</p>

    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required>
      </div>

      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="Confirm your password" required>
      </div>

      <button type="submit">Create Account</button>

      <div id="status-message" class="status-message"></div>
    </form>

    <div class="footer-link">
      Already have an account? <a href="/login.html">Login here</a>
    </div>
    <div class="footer-link">
      <a href="/">Back to Home</a>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    function handleRegister(event) {
      event.preventDefault();
      
      const password = document.querySelector("input[type='password']").value;
      const confirm = document.querySelector("#confirm").value;

      if (password !== confirm) {
        alert("Passwords do not match!");
        document.getElementById("status-message").innerHTML = "<span class='error'>❌ Passwords do not match!</span>";
        return;
      }

      registerUser();
    }

    async function registerUser() {
      const name = document.querySelector("#name").value;
      const email = document.querySelector("#email").value;
      const password = document.querySelector("input[type='password']").value;

      if (!name || !email || !password) {
        alert("Please fill in all fields");
        return;
      }

      try {
        const response = await fetch(`/api/register`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();
        console.log("✅ Registration successful:", data);
        
        if (data.success) {
          alert("✅ Account created! Redirecting to login...");
          document.getElementById("status-message").innerHTML = "<span class='success'>✅ Account created! Redirecting...</span>";
          setTimeout(() => {
            window.location.href = "/login.html";
          }, 1500);
        }
      } catch (error) {
        console.error("❌ Registration error:", error);
        document.getElementById("status-message").innerHTML = "<span class='error'>❌ Registration failed!</span>";
      }
    }
  </script>
</body>
</html>
