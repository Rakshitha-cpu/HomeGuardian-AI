<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — HomeGuardian AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1620; --ink-soft:#12222E;
  --purple:#8B5CF6; --purple-light:#C4B5FD; --pink:#F472B6; --cyan:#22D3EE; --amber:#FBBF24;
  --paper:#F1F3EF; --paper-dim:#E4E8E2;
  --gray:#8B9199; --line:rgba(18,34,46,0.12); --red:#E0705C; --green:#34D399; --radius:18px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(1100px 800px at 90% -10%, rgba(251,191,36,0.4), transparent 55%),
    radial-gradient(1000px 700px at -10% 20%, rgba(139,92,246,0.55), transparent 50%),
    radial-gradient(900px 700px at 60% 120%, rgba(34,211,238,0.4), transparent 55%),
    linear-gradient(160deg,#0B1620 0%,#1A0F2E 55%,#12122E 100%);
  background-size:200% 200%, 200% 200%, 200% 200%, 100% 100%;
  animation:gradientShift 16s ease-in-out infinite;
  color:var(--ink); font-family:'Inter',sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  position:relative; overflow:hidden;
}
@keyframes gradientShift{
  0%,100%{ background-position:0% 0%, 100% 0%, 50% 100%, 0 0; }
  50%{ background-position:30% 30%, 70% 40%, 60% 70%, 0 0; }
}
.blob{ position:fixed; border-radius:50%; filter:blur(80px); opacity:0.5; pointer-events:none; animation:float 9s ease-in-out infinite; z-index:0; }
.blob1{ width:340px; height:340px; background:var(--amber); top:-90px; right:-60px; }
.blob2{ width:320px; height:320px; background:var(--purple); bottom:-100px; left:-80px; animation-delay:-3s; }
.blob3{ width:260px; height:260px; background:var(--cyan); top:55%; left:65%; animation-delay:-6s; }
@keyframes float{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-20px,26px) scale(1.1); } }
a{color:inherit;}
h1{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; font-size:30px; margin-bottom:6px;
   background:linear-gradient(90deg,var(--amber),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.sub{color:#B7C0CC; font-size:14px; margin-bottom:28px;}
.card{
  position:relative; z-index:1;
  background:rgba(18,22,34,0.72); backdrop-filter:blur(20px) saturate(1.3);
  border:1px solid rgba(255,255,255,0.12); border-radius:var(--radius);
  padding:42px; width:100%; max-width:420px;
  box-shadow:0 30px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.03) inset;
  animation:cardIn .6s cubic-bezier(.2,.8,.2,1);
}
@keyframes cardIn{ from{ opacity:0; transform:translateY(18px) scale(0.98);} to{ opacity:1; transform:translateY(0) scale(1);} }
.brand{font-family:'Fraunces',serif; font-weight:600; font-size:18px; margin-bottom:32px; display:flex; align-items:center; gap:8px; color:#fff;}
.brand-mark{width:12px; height:12px; border-radius:50%; background:linear-gradient(135deg,var(--amber),var(--pink)); display:inline-block; box-shadow:0 0 14px rgba(244,114,182,0.8);}
label{display:block; font-size:11.5px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.09em; color:var(--cyan); margin-bottom:6px; margin-top:18px;}
input{
  width:100%; padding:13px 14px; border:1px solid rgba(255,255,255,0.14); border-radius:10px;
  font-family:'Inter',sans-serif; font-size:15px; background:rgba(255,255,255,0.06); color:#fff;
  transition:border-color .2s ease, background .2s ease, box-shadow .2s ease;
}
input::placeholder{ color:#6B7684; }
input:focus{ outline:none; border-color:var(--purple-light); background:rgba(255,255,255,0.1); box-shadow:0 0 0 4px rgba(139,92,246,0.22); }
.btn{
  margin-top:28px; width:100%; padding:14px; border:none; border-radius:10px;
  background:linear-gradient(90deg,var(--amber),var(--pink)); background-size:180% 100%;
  color:#1A0F2E; font-weight:700; font-size:15px; cursor:pointer; letter-spacing:0.01em;
  transition:background-position .4s ease, transform .15s ease, box-shadow .2s ease;
  box-shadow:0 10px 30px -8px rgba(251,191,36,0.5);
}
.btn:hover{ background-position:100% 0; transform:translateY(-2px); box-shadow:0 14px 36px -8px rgba(244,114,182,0.6); }
.btn:active{ transform:translateY(0); }
.btn:disabled{opacity:0.6; cursor:not-allowed; transform:none;}
.msg{margin-top:14px; font-size:13px; min-height:18px;}
.msg.error{color:#FCA5A5;}
.msg.ok{color:var(--green);}
.foot{margin-top:26px; font-size:13px; color:#9AA5B1; text-align:center;}
.foot a{color:var(--cyan); font-weight:600; text-decoration:none;}
.foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="card">
  <div class="brand"><span class="brand-mark"></span> HomeGuardian AI</div>
  <h1>Create your account</h1>
  <div class="sub">Get a Home Intelligence Report in minutes.</div>

  <form id="registerForm">
    <label for="name">Name</label>
    <input type="text" id="name" required placeholder="Your name">
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="you@example.com">
    <label for="password">Password</label>
    <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
    <button class="btn" type="submit" id="registerBtn">Create account →</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="foot">Already have an account? <a href="login.html">Log in</a></div>
</div>

<script src="auth.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('registerBtn');
  msg.className = 'msg'; msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const res = await HGAuth.authFetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Registration failed');
    HGAuth.setSession(data.token, data.user);
    msg.className = 'msg ok'; msg.textContent = 'Account created — redirecting…';
    window.location.href = 'index.html';
  } catch (err) {
    msg.className = 'msg error'; msg.textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Create account →';
  }
});
</script>
</body>
</html>
